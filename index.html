const quiz = document.getElementById("quiz");

questions.forEach((item,index)=>{

    let html = `
    <div class="question">
        <h3>${item.q}</h3>
    `;

    item.options.forEach((opt,i)=>{

        html += `
        <div class="option"
            onclick="checkAnswer(this,${index},${i})">
            ${String.fromCharCode(65+i)}. ${opt}
        </div>
        `;

    });

    html += `
        <div class="result" id="result-${index}"></div>
    </div>
    `;

    quiz.innerHTML += html;

});

let correctCount = 0;
let lockedQuestions = {};

function checkAnswer(el,qIndex,optIndex){

    if(lockedQuestions[qIndex]) return;

    const questionDiv = el.parentElement;
    const options = questionDiv.querySelectorAll(".option");
    const result = document.getElementById(`result-${qIndex}`);

    if(optIndex === questions[qIndex].answer){

        el.classList.add("correct");

        result.innerHTML = "✅ Chính xác";
        result.className = "result correct-text";

        lockedQuestions[qIndex] = true;
        correctCount++;

        options.forEach(o=>{
            o.classList.add("locked");
        });

    }else{

        el.classList.add("wrong");

        result.innerHTML = "❌ Sai, hãy chọn lại";
        result.className = "result wrong-text";

        setTimeout(()=>{
            el.classList.remove("wrong");
        },600);

    }

}

function submitQuiz(){

    const total = questions.length;

    document.getElementById("scoreBox").style.display="block";

    document.getElementById("scoreText").innerHTML =
        `Bạn đã làm đúng <strong>${correctCount}/${total}</strong> câu`;

}
</script>
